services:
  vllm:
    build:
      context: .
      dockerfile: Dockerfile.vllm
      args:
        - PROJECT_PATH=/project/scam-call-llm
      secrets:
        - HF_TOKEN
        - GITHUB_TOKEN
    shm_size: 16g
    ports:
      - "18000:8000"
    environment:
      - VLLM_USE_V1=0
      - NCCL_P2P_DISABLE=1
      - CUDA_VISIBLE_DEVICES=0
      - VLLM_GPU_MEMORY_UTILIZATION=${VLLM_GPU_MEMORY_UTILIZATION:-0.60}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  app:
    build: 
      context: .
      dockerfile: Dockerfile.app
      args:
        - PROJECT_PATH=/project/app
    ports:
      - "9000:9000"
    depends_on:
      vllm:
        condition: service_healthy

secrets:
  HF_TOKEN:
    environment: HF_TOKEN
  GITHUB_TOKEN:
    environment: GITHUB_TOKEN